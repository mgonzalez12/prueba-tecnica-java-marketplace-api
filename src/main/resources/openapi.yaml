openapi: 3.0.3
info:
  title: Marketplace API
  description: API for Marketplace application using API First approach
  version: 1.0.0
  contact:
    name: Backend Developer
    email: dev@marketplace.com

servers:
  - url: http://localhost:8080
    description: Local server

paths:
  /api/v1/customers:
    get:
      summary: List all customers
      operationId: getAllCustomers
      tags:
        - Customers
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      summary: Create a new customer
      operationId: createCustomer
      tags:
        - Customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /api/v1/customers/{id}:
    get:
      summary: Get customer by ID
      operationId: getCustomerById
      tags:
        - Customers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
    put:
      summary: Update existing customer
      operationId: updateCustomer
      tags:
        - Customers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found

  /api/v1/customers/activity:
    get:
      summary: Get customers by last activity date range
      operationId: getCustomersByActivityDate
      tags:
        - Customers
      parameters:
        - name: fromDate
          in: query
          required: true
          description: Start date (inclusive) in ISO format (yyyy-MM-dd)
          schema:
            type: string
            example: "2025-01-01"
        - name: toDate
          in: query
          required: true
          description: End date (inclusive) in ISO format (yyyy-MM-dd)
          schema:
            type: string
            example: "2025-12-31"
      responses:
        '200':
          description: Customers found in date range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'

  /api/v1/customers/{id}/activity:
    post:
      summary: Record customer activity (updates last activity date and order count)
      operationId: recordCustomerActivity
      tags:
        - Customers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Customer activity recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found

components:
  schemas:
    Customer:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        birthDate:
          type: string
          format: date
    
    CustomerRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        birthDate:
          type: string
          format: date

